name: phase1-verify-key

on:
  push:
    paths:
      - '.github/workflows/phase1-verify-key.yml'
  workflow_dispatch:

env:
  BR_VERSION: "2025.02.14"
  BR_URL: "https://buildroot.org/downloads"

jobs:
  verify-key:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Claimed signing key (from the signature itself, NOT trusted)
        run: |
          set -eu
          K="$RUNNER_TEMP/k"
          mkdir -p "$K/home_empty"
          chmod 700 "$K/home_empty"
          cd "$K"
          gpg --version | sed -n '1p'
          command -v dirmngr || echo "dirmngr NOT found (keyserver/WKD steps may fail)"
          curl -fsSL -o sign_latest "${BR_URL}/buildroot-${BR_VERSION}.tar.gz.sign"
          GNUPGHOME="$K/home_empty" gpg --batch --no-tty --verify sign_latest > verify_latest.txt 2>&1 || true
          cat verify_latest.txt
          GNUPGHOME="$K/home_empty" gpg --batch --no-tty --list-packets sign_latest > packets_latest.txt 2>&1 || true
          echo "--- issuer info from packets ---"
          grep -E 'keyid|issuer fpr' packets_latest.txt || true
          FPR=$(sed -n 's/.*using [A-Za-z0-9]* key \([0-9A-F]\{40\}\).*/\1/p' verify_latest.txt | sort -u)
          echo "claimed signing key fingerprint: $FPR"
          if [ "$(printf '%s' "$FPR" | wc -c)" -ne 40 ]; then
            echo "FAIL: could not extract exactly one 40-hex fingerprint"
            exit 1
          fi
          printf '%s\n' "$FPR" > claimed_fpr.txt
          echo "CLAIMED_FPR=$FPR" >> summary.txt
          echo "NOTE: this fingerprint may belong to a signing SUBKEY. Primary key is shown in the keyserver step."

      - name: Keyserver lookup (temporary keyrings, informational only)
        continue-on-error: true
        run: |
          set -u
          K="$RUNNER_TEMP/k"
          cd "$K"
          FPR=$(cat claimed_fpr.txt)
          for SRV in keyserver.ubuntu.com keys.openpgp.org; do
            H="$K/home_$SRV"
            mkdir -p "$H"
            chmod 700 "$H"
            echo "===== $SRV ====="
            if GNUPGHOME="$H" timeout 90 gpg --batch --no-tty --keyserver "hkps://$SRV" --recv-keys "$FPR" > "recv_$SRV.txt" 2>&1; then
              echo "recv: OK"
            else
              echo "recv: FAILED"
            fi
            cat "recv_$SRV.txt"
            GNUPGHOME="$H" gpg --batch --no-tty --list-keys --with-colons --with-subkey-fingerprints > "colons_$SRV.txt" 2>&1 || true
            echo "--- pub/sub/fpr/uid records (type:validity:len:algo:keyid:created:expires ... :text) ---"
            grep -E '^(pub|sub|fpr|uid):' "colons_$SRV.txt" | cut -d: -f1,2,3,4,5,6,7,10 | sed -n '1,40p'
            PRIMARY=$(awk -F: '$1=="pub"{p=1;next} $1=="fpr"&&p==1{print $10;p=0}' "colons_$SRV.txt" | tr '\n' ' ')
            if awk -F: -v f="$FPR" '$1=="fpr"&&$10==f{found=1} END{exit !found}' "colons_$SRV.txt"; then
              if printf '%s' "$PRIMARY" | grep -q "$FPR"; then
                echo "KEYSERVER_$SRV: FOUND, claimed fpr is the PRIMARY key" >> summary.txt
              else
                echo "KEYSERVER_$SRV: FOUND, claimed fpr is a SUBKEY of primary: $PRIMARY" >> summary.txt
              fi
            else
              echo "KEYSERVER_$SRV: NOT FOUND (or lookup failed)" >> summary.txt
            fi
            echo "--- signatures on the key (who certified it), first 60 lines ---"
            GNUPGHOME="$H" gpg --batch --no-tty --list-sigs --keyid-format long > "sigs_$SRV.txt" 2>&1 || true
            sed -n '1,60p' "sigs_$SRV.txt"
          done

      - name: WKD lookup (key published by the uid's own domain)
        continue-on-error: true
        run: |
          set -u
          K="$RUNNER_TEMP/k"
          cd "$K"
          FPR=$(cat claimed_fpr.txt)
          cat colons_*.txt 2>/dev/null | awk -F: '$1=="uid"{print $10}' | grep -oE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+' | sort -u > emails.txt || true
          echo "emails found in key uids:"
          cat emails.txt
          if [ ! -s emails.txt ]; then
            echo "WKD: NO EMAIL (no uid from keyservers)" >> summary.txt
            exit 0
          fi
          N=0
          while read -r E; do
            N=$((N+1))
            H="$K/home_wkd_$N"
            mkdir -p "$H"
            chmod 700 "$H"
            echo "===== WKD for $E ====="
            GNUPGHOME="$H" timeout 60 gpg --batch --no-tty --auto-key-locate clear,wkd --locate-external-keys "$E" > "wkd_$N.txt" 2>&1 < /dev/null || true
            cat "wkd_$N.txt"
            GNUPGHOME="$H" gpg --batch --no-tty --list-keys --with-colons --with-subkey-fingerprints > "wkdcolons_$N.txt" 2>&1 < /dev/null || true
            if awk -F: -v f="$FPR" '$1=="fpr"&&$10==f{found=1} END{exit !found}' "wkdcolons_$N.txt"; then
              echo "WKD($E): MATCH (domain publishes key with the claimed fingerprint)" >> summary.txt
            else
              echo "WKD($E): NO MATCH or NOT PUBLISHED" >> summary.txt
            fi
          done < emails.txt

      - name: Continuity (older releases, same host so weaker evidence)
        continue-on-error: true
        run: |
          set -u
          K="$RUNNER_TEMP/k"
          cd "$K"
          FPR=$(cat claimed_fpr.txt)
          SHORT="${FPR: -16}"
          mkdir -p dl
          curl -fsSL "${BR_URL}/" > index.html 2>/dev/null || echo "downloads index fetch failed"
          grep -oE 'buildroot-[0-9]{4}\.[0-9]{2}(\.[0-9]+)?\.tar\.gz\.sign' index.html | sort -uV > all_signs.txt || true
          if [ ! -s all_signs.txt ]; then
            echo "index had no usable list, trying download.html"
            curl -fsSL "https://buildroot.org/download.html" 2>/dev/null | grep -oE 'buildroot-[0-9]{4}\.[0-9]{2}(\.[0-9]+)?\.tar\.gz\.sign' | sort -uV > all_signs.txt || true
          fi
          TOTAL=$(wc -l < all_signs.txt)
          echo "sign files listed: $TOTAL"
          if [ "$TOTAL" -eq 0 ]; then
            echo "CONTINUITY: NO LIST (could not discover older releases)" >> summary.txt
            exit 0
          fi
          STEP=$(( TOTAL / 24 + 1 ))
          awk -v s="$STEP" 'NR%s==1' all_signs.txt > sample.txt
          tail -n 1 all_signs.txt >> sample.txt
          sort -uV sample.txt -o sample.txt
          echo "sampling $(wc -l < sample.txt) files"
          : > table.txt
          while read -r F; do
            if ! curl -fsSL -o "dl/$F" "${BR_URL}/$F" < /dev/null; then
              echo "$F | download failed" >> table.txt
              continue
            fi
            GNUPGHOME="$K/home_empty" gpg --batch --no-tty --verify "dl/$F" > "dl/$F.v" 2>&1 < /dev/null || true
            GNUPGHOME="$K/home_empty" gpg --batch --no-tty --list-packets "dl/$F" > "dl/$F.p" 2>&1 < /dev/null || true
            D=$(sed -n 's/^gpg: Signature made //p' "dl/$F.v" | sed -n '1p')
            V=$(sed -n 's/.*using [A-Za-z0-9]* key \([0-9A-F]*\).*/\1/p' "dl/$F.v" | sed -n '1p')
            I=$(grep -oE 'keyid [0-9A-F]{16}' "dl/$F.p" | awk '{print $2}' | sort -u | tr '\n' ',')
            P=$(grep -oE 'issuer fpr v4 [0-9A-F]{40}' "dl/$F.p" | awk '{print $4}' | sort -u | tr '\n' ',')
            printf '%s | %s | verify_key=%s | keyid=%s | issuer_fpr=%s\n' "$F" "$D" "$V" "$I" "$P" >> table.txt
          done < sample.txt
          echo "===== continuity table ====="
          cat table.txt
          echo "===== distinct signer keyids across sample ====="
          grep -oE 'keyid=[0-9A-F,]*' table.txt | sort | uniq -c
          TOTAL_ROWS=$(wc -l < table.txt)
          SAME=$(grep -c "$SHORT" table.txt || true)
          echo "CONTINUITY: $SAME of $TOTAL_ROWS sampled releases mention keyid ending $SHORT (see table for others)" >> summary.txt

      - name: Debian keyring check (Ubuntu archive package, informational)
        continue-on-error: true
        run: |
          set -u
          K="$RUNNER_TEMP/k"
          cd "$K"
          FPR=$(cat claimed_fpr.txt)
          mkdir -p deb
          cd deb
          sudo apt-get update -qq > /dev/null 2>&1 || echo "apt-get update had problems"
          apt-cache policy debian-keyring | sed -n '1,12p'
          if ! apt-get download debian-keyring; then
            echo "DEBIAN_KEYRING: PACKAGE NOT AVAILABLE (check skipped)" >> "$K/summary.txt"
            exit 0
          fi
          ls -l ./*.deb
          dpkg-deb -x debian-keyring_*.deb x
          find x -type f \( -name '*.gpg' -o -name '*.pgp' -o -name '*.kbx' \) -print > files.txt
          echo "keyring files found:"
          cat files.txt
          HITS=0
          while read -r F; do
            GNUPGHOME="$K/home_empty" gpg --batch --no-tty --show-keys --with-colons --with-subkey-fingerprints "$F" > keys.out 2>&1 < /dev/null || true
            echo "$F: key records = $(grep -c '^pub:' keys.out || true)"
            awk -F: -v f="$FPR" '
              $1=="pub"{ if(hit) printf "%s", buf; buf=""; hit=0 }
              $1=="pub"||$1=="sub"||$1=="uid"||$1=="fpr"{ buf=buf $0 "\n" }
              $1=="fpr"&&$10==f{ hit=1 }
              END{ if(hit) printf "%s", buf }' keys.out > match.out
            if [ -s match.out ]; then
              HITS=$((HITS+1))
              echo "MATCH in $F:"
              cut -d: -f1,2,3,4,5,6,7,10 match.out
            fi
          done < files.txt
          if [ "$HITS" -gt 0 ]; then
            echo "DEBIAN_KEYRING: FOUND in $HITS keyring file(s)" >> "$K/summary.txt"
          else
            echo "DEBIAN_KEYRING: NOT FOUND (only means signer is not in that keyring)" >> "$K/summary.txt"
          fi

      - name: Summary (nothing is pinned by this workflow)
        if: always()
        run: |
          K="$RUNNER_TEMP/k"
          echo "===== SUMMARY ====="
          cat "$K/summary.txt" || echo "no summary file"
          echo "PINNING: NOT DONE (needs your manual independent checks, Step 1.3)"
